<!-- ═══════════════════════════════════════════════════════════════
     TERAPİDEYİM · ANİMASYON EKLENTİSİ
     Bu bloğun tamamını testler sayfasında </body> etiketinden hemen ÖNCE yapıştırın.
     Mevcut hiçbir satırı değiştirmez; yalnızca üzerine ekleme yapar.
     ═══════════════════════════════════════════════════════════════ -->
<style>
/* ── Arka plan: yavaş süzülen yumuşak ışık lekeleri ── */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient span{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(143,175,155,.30),transparent 65%);animation:blobFloat 24s ease-in-out infinite alternate;will-change:transform}
.ambient span:nth-child(1){width:560px;height:560px;top:-180px;left:-160px}
.ambient span:nth-child(2){width:480px;height:480px;bottom:-160px;right:-140px;animation-duration:30s;animation-delay:-8s;background:radial-gradient(circle,rgba(36,55,70,.10),transparent 65%)}
.ambient span:nth-child(3){width:380px;height:380px;top:45%;left:55%;animation-duration:36s;animation-delay:-15s;opacity:.7}
@keyframes blobFloat{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(60px,40px,0) scale(1.12)}}

/* ── Header ── */
header{animation:hdrIn .6s cubic-bezier(.22,1,.36,1) backwards;transition:box-shadow .3s}
header.scrolled{box-shadow:0 6px 24px rgba(36,55,70,.08)}
@keyframes hdrIn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
.logo-mark{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.back-btn:hover{transform:translateX(-3px)}

/* ── Hero ── */
.page-eyebrow{animation:upIn .7s .05s cubic-bezier(.22,1,.36,1) backwards}
.page-title{isolation:isolate;animation:upIn .8s .15s cubic-bezier(.22,1,.36,1) backwards}
.page-sub{animation:upIn .8s .28s cubic-bezier(.22,1,.36,1) backwards}
.page-title em{position:relative}
.page-title em::after{content:'';position:absolute;left:0;right:0;bottom:3px;height:7px;border-radius:4px;background:rgba(143,175,155,.32);z-index:-1;transform:scaleX(0);transform-origin:left;animation:lineDraw .9s .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes upIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes lineDraw{to{transform:scaleX(1)}}

/* ── Test kartları: sırayla giriş, mouse ışığı, hover ── */
.test-card{position:relative;overflow:hidden;isolation:isolate;animation:cardIn .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(.35s + var(--i,0)*.07s);transition:border-color .25s,box-shadow .3s,transform .3s cubic-bezier(.22,1,.36,1)}
.test-card::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(143,175,155,.26),transparent 62%)}
.test-card:hover{transform:translateY(-5px);box-shadow:0 14px 36px rgba(36,55,70,.10)}
.test-card:hover::before{opacity:1}
.test-card:active{transform:translateY(-2px) scale(.985)}
.test-card:hover .tc-icon{animation:iconWiggle .7s ease}
.tc-icon{display:inline-block;transform-origin:50% 80%}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes iconWiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.18)}60%{transform:rotate(7deg) scale(1.12)}}

/* ── Test alanı geçişi ── */
#testArea{animation:areaIn .45s cubic-bezier(.22,1,.36,1) backwards}
@keyframes areaIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ── İlerleme çubuğu: parlama efekti ── */
.progress-fill{position:relative;overflow:hidden;transition:width .55s cubic-bezier(.22,1,.36,1)}
.progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shimmer 2.2s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* ── Soru kartı: yöne duyarlı geçiş (ileri → sağdan, geri → soldan) ── */
.question-card.fade-in{animation:qIn .5s cubic-bezier(.22,1,.36,1) backwards}
#testArea[data-dir="back"] .question-card.fade-in{animation-name:qInBack}
@keyframes qIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes qInBack{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}

/* Seçenekler sırayla belirir */
.question-card.fade-in .opt-btn,
.question-card.fade-in .opt-btn-wide,
.question-card.fade-in .dual-group{animation:optIn .45s cubic-bezier(.22,1,.36,1) backwards;animation-delay:.1s}
.question-card.fade-in :is(.opts-grid,.opts-col,.dual-wrap)>:nth-child(2){animation-delay:.16s}
.question-card.fade-in :is(.opts-grid,.opts-col,.dual-wrap)>:nth-child(3){animation-delay:.22s}
.question-card.fade-in :is(.opts-grid,.opts-col,.dual-wrap)>:nth-child(4){animation-delay:.28s}
.question-card.fade-in :is(.opts-grid,.opts-col,.dual-wrap)>:nth-child(5){animation-delay:.34s}
.question-card.fade-in :is(.opts-grid,.opts-col,.dual-wrap)>:nth-child(6){animation-delay:.40s}
@keyframes optIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Bir seçenek işaretlenince kart yeniden animasyon yapmasın (titremeyi önler) */
.rerender .question-card.fade-in,
.rerender .opt-btn,
.rerender .opt-btn-wide,
.rerender .dual-group{animation:none!important}

/* Seçenek hover / tıklama / seçili */
.opt-btn:hover{transform:translateY(-2px)}
.opt-btn-wide:hover{transform:translateX(4px)}
.opt-btn:active,.opt-btn-wide:active,.dual-btn:active{transform:scale(.98)}
.opt-btn.selected .opt-check,.opt-btn-wide.selected .opt-check{animation:checkPop .4s cubic-bezier(.34,1.56,.64,1)}
.opt-btn-wide.selected .opt-check{background:var(--sage);border-color:var(--sage)}
.opt-btn-wide.selected .opt-check::after{content:'✓';color:#fff;font-size:10px;font-weight:700}
.dual-btn.selected{animation:checkPop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes checkPop{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* Cevap verilmeden ilerlenirse kart sallanır */
#questionArea .question-card.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)!important}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ── Gezinme butonları ── */
.btn-next-q{position:relative;overflow:hidden}
.btn-next-q::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .65s}
.btn-next-q:hover::after{left:140%}
.btn-next-q:active,.btn-back-q:active,.btn-goback:active,.btn-expert:active{transform:scale(.97)}
.btn-expert,.btn-goback{transition:background .18s,border-color .18s,transform .2s,box-shadow .25s}
.btn-expert:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(78,131,181,.28)}
.btn-goback:hover{transform:translateY(-2px)}

/* ── Sonuç ekranı ── */
.result-box{animation:areaIn .6s cubic-bezier(.22,1,.36,1) backwards}
.result-box>*:not(.result-emoji){animation:upIn .65s cubic-bezier(.22,1,.36,1) backwards}
.result-box>:nth-child(2){animation-delay:.12s}
.result-box>:nth-child(3){animation-delay:.2s}
.result-box>:nth-child(4){animation-delay:.3s}
.result-box>:nth-child(5){animation-delay:.4s}
.result-box>:nth-child(6){animation-delay:.5s}
.result-box>:nth-child(7){animation-delay:.6s}
.result-box>:nth-child(8){animation-delay:.7s}
.result-box>:nth-child(9){animation-delay:.8s}
.result-score-ring{position:relative;animation:ringIn .9s .15s cubic-bezier(.34,1.56,.64,1) backwards!important}
.result-score-ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--rc,#8FAF9B);opacity:0;animation:ringPulse 1.8s 1s ease-out 2}
@keyframes ringIn{from{opacity:0;transform:scale(.5) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.5);opacity:0}}

/* ── Hareketi azaltmak isteyen kullanıcılar için ── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .ambient{display:none}
}
</style>

<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var area=document.getElementById('questionArea');
  var testArea=document.getElementById('testArea');
  var lastKey=null;

  /* Arka plan ışıkları */
  var amb=document.createElement('div');
  amb.className='ambient';
  amb.innerHTML='<span></span><span></span><span></span>';
  document.body.prepend(amb);

  /* Kartlara sıra numarası (kademeli giriş için) */
  document.querySelectorAll('.test-card').forEach(function(c,i){c.style.setProperty('--i',i);});

  /* Kartlarda fareyi takip eden ışık */
  document.addEventListener('pointermove',function(e){
    var c=e.target.closest&&e.target.closest('.test-card');
    if(!c)return;
    var r=c.getBoundingClientRect();
    c.style.setProperty('--mx',(e.clientX-r.left)+'px');
    c.style.setProperty('--my',(e.clientY-r.top)+'px');
  },{passive:true});

  /* Kaydırınca header gölgesi */
  var hd=document.querySelector('header');
  function onScroll(){hd.classList.toggle('scrolled',window.scrollY>8);}
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  /* Sayı sayma animasyonu */
  function countUp(el){
    var to=parseInt(el.textContent,10);
    if(isNaN(to)||to<=0)return;
    el.textContent='0';
    setTimeout(function(){
      var t0=null,dur=1100;
      (function step(t){
        if(!t0)t0=t;
        var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
        el.textContent=Math.round(to*e);
        if(p<1)requestAnimationFrame(step);
      })(performance.now());
    },350);
  }

  /* Mevcut fonksiyonları bozmadan sarmalıyoruz */
  var _showTestArea=window.showTestArea;
  window.showTestArea=function(){
    lastKey=null;
    testArea.dataset.dir='fwd';
    _showTestArea.apply(this,arguments);
    window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  };

  var _renderQ=window.renderQ;
  window.renderQ=function(){
    var key=window.mode+':'+window.current;
    area.classList.toggle('rerender',key===lastKey); /* aynı soruda seçim yapılıyorsa giriş animasyonunu tekrarlama */
    lastKey=key;
    _renderQ.apply(this,arguments);
  };

  var _nextQ=window.nextQ;
  window.nextQ=function(){
    testArea.dataset.dir='fwd';
    if(!window.isAnswered()){
      var c=document.querySelector('.question-card');
      if(c){
        c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
        setTimeout(function(){c.classList.remove('shake');},500);
      }
    }
    _nextQ.apply(this,arguments);
  };

  var _prevQ=window.prevQ;
  window.prevQ=function(){
    testArea.dataset.dir='back';
    _prevQ.apply(this,arguments);
  };

  var _showResult=window.showResult;
  window.showResult=function(){
    _showResult.apply(this,arguments);
    var r=document.getElementById('resultArea');
    var ring=r.querySelector('.result-score-ring');
    if(ring)ring.style.setProperty('--rc',ring.style.borderColor||'#8FAF9B');
    var num=r.querySelector('.score-num');
    if(num&&!reduce)countUp(num);
  };
})();
</script>
